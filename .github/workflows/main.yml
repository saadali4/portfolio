# CI/CD Pipeline for Portfolio Website
# This workflow performs quality checks and deploys to GitHub Pages
name: Deploy Portfolio with Quality Checks to Github Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Concurrency control - cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cache npm dependencies to speed up subsequent runs
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # html Validation
      - name: Validate HTML
        run: |
          npm install -g html-validator-cli
          npx html-validator --file=index.html --verbose
        continue-on-error: false

      # CSS Validation
      - name: Validate CSS
        run: |
          npm install -g css-validator
          find . -name "*.css" -exec npx css-validator {} \;
        continue-on-error: true

      # Link Checker - Verify all links are valid
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress './**/*.html'
          fail: true
        continue-on-error: true

      # Accessibility Testing
      - name: Run accessibility tests
        run: |
          npm install -g pa11y-ci
          npx pa11y-ci index.html --threshold 10
        continue-on-error: true

      # Security scan for common vulnerabilities
      - name: Security scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'file://${{ github.workspace }}/index.html'
        continue-on-error: true

      # Lighthouse CI for performance, accessibility, SEO
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            file://${{ github.workspace }}/index.html
          uploadArtifacts: true
        continue-on-error: true

      # Upload test results as artifacts for review
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            lighthouse-results
            pa11y-results
          retention-days: 30

  # ============================================
  # Build Job - Optimize assets before deployment
  # ============================================
  build:
    name: Build and Optimize
    runs-on: ubuntu-latest
    needs: ci
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Optimize images (if you have images)
      - name: Optimize images
        uses: calibreapp/image-actions@main
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          jpegQuality: '80'
          pngQuality: '80'
          webpQuality: '80'
        continue-on-error: true

      # Prepare deployment files
      - name: Prepare deployment files
        run: |
          mkdir -p dist
          cp -r * dist/ 2>/dev/null || true

      # Upload build artifacts for deployment job
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-build
          path: .
          retention-days: 1


  deploy:
    name: Deploy to GitHub Pages
    needs: [ci, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    # Deploy to production environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: portfolio-build
          path: ./dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Verify deployment
      - name: Verify deployment
        run: |
          echo "Deployment successful!"
          echo "Site URL: ${{ steps.deployment.outputs.page_url }}"


  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [ci, build, deploy]
    if: always()
    
    steps:
      - name: Check workflow status
        run: |
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "Pipeline completed successfully!"
          else
            echo "Pipeline failed. Check logs for details."
            exit 1
          fi
